{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card shadow-sm">
        <div class="card-body">

          <h1 class="h4 mb-4 text-center">Новый предмет</h1>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <!-- Название -->
            <div class="mb-3">
              <label class="form-label">{{ form.name.label }}</label>
              {{ form.name }}
            </div>

            <!-- Курс -->
            <div class="mb-3">
              <label class="form-label">{{ form.course.label }}</label>
              {{ form.course }}
            </div>

            <!-- Институт -->
            <div class="mb-4">
              <label class="form-label">{{ form.institute.label }}</label>
              {{ form.institute }}
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Добавить предмет
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
