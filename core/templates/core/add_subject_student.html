{% extends "core/base.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 720px;">

  <h2 class="mb-4 text-center">Добавить предмет</h2>

  {% if subjects %}
    <div class="list-group">
      {% for subject in subjects %}
        <form method="post" class="list-group-item list-group-item-action p-0">
          {% csrf_token %}
          <input type="hidden" name="subject_id" value="{{ subject.id }}">
          <button type="submit"
                  class="btn btn-link w-100 text-start text-decoration-none p-3">
            <div class="fw-semibold">{{ subject.name }}</div>
            <div class="text-muted small">{{ subject.teacher.full_name }}</div>
          </button>
        </form>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-secondary text-center">
      Нет доступных предметов
    </div>
  {% endif %}

</div>
{% endblock %}
