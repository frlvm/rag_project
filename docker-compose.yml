services:
  postgres:
    restart: unless-stopped
    container_name: postgres
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    volumes:
      - ./volumes/postgres/:/var/lib/postgresql/data
  chroma:
    restart: unless-stopped
    container_name: chroma
    image: chromadb/chroma:1.5.0
    volumes:
      - ./volumes/chroma/:/data
  django:
    restart: unless-stopped
    container_name: django
    build: .
    image: rag-project:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy 
      chroma:
        condition: service_started
    volumes:
      - type: bind
        source: ./data/static/
        target: /data/static/

  nginx:
    restart: unless-stopped
    container_name: nginx
    image: nginx:latest
    ports:
      - 8080:80
    volumes:
      - type: bind
        source: ./nginx/conf.d/rag_project.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./data/static/
        target: /var/www/rag_project/static/
        read_only: true
    depends_on:
      - django
        


